# argus-agent example configuration.
# Validate with: argus-agent -config agent.yaml -check
tenant: acme
data_dir: /var/lib/argus-agent        # WAL, checkpoints and bookmarks live here
buffer:
  max_bytes: 2147483648               # 2 GiB of buffered data during outages
  segment_bytes: 67108864
flush_interval: 1s

output:
  brokers: ["redpanda-0.argus.svc:9093", "redpanda-1.argus.svc:9093"]
  username: agent-acme
  password_file: /etc/argus/agent-password
  tls: true

files:
  - path: /var/log/auth.log
    kind: linux
    source_id: linux-auth
  - path: /var/log/audit/audit.log
    kind: linux
    source_id: linux-auditd
  - path: /var/log/nginx/access.log
    kind: nginx
    source_id: web-nginx
    start_at_end: true

syslog:
  tls: 0.0.0.0:6514                   # RFC 5425; prefer TLS over UDP
  cert_file: /etc/argus/syslog.crt
  key_file: /etc/argus/syslog.key
  allow: ["10.0.0.0/8"]               # sender allow-list
  source_id: network-syslog

